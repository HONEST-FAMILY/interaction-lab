<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f1eee7">
<title>01 한글 파티클 — 인터랙션 랩</title>
<link rel="icon" href="../assets/favicon.svg">
<link rel="stylesheet" href="../assets/lab.css">
<style>
  .type-form {
    pointer-events: auto;
    display: flex;
    align-items: center;
    height: 40px;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 0 4px 0 16px;
    transition: border-color 0.3s var(--ease-out), background-color 0.3s var(--ease-out);
  }
  .type-form:focus-within { border-color: var(--ink); background: rgba(255, 255, 255, 0.5); }
  .type-form input {
    width: 112px;
    border: 0;
    outline: 0;
    background: transparent;
    font: 600 14px/1 var(--font);
    color: var(--ink);
    -webkit-user-select: text;
    user-select: text;
  }
  .type-form input::placeholder { color: var(--muted); }
  .type-form button {
    width: 32px;
    height: 32px;
    border: 0;
    border-radius: 50%;
    background: var(--ink);
    color: var(--paper);
    font: 700 14px/1 var(--font);
    cursor: pointer;
    transition: transform 0.4s var(--ease-out), background-color 0.3s var(--ease-out);
  }
  .type-form button:hover { transform: scale(1.08); background: var(--accent); }
  .type-word {
    position: fixed;
    left: 50%;
    top: max(70px, calc(env(safe-area-inset-top) + 64px));
    transform: translateX(-50%);
    display: flex;
    gap: 6px;
    pointer-events: none;
    z-index: 10;
  }
  .type-word i {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--line);
    transition: background-color 0.4s var(--ease-out), transform 0.4s var(--ease-out);
  }
  .type-word i.is-on { background: var(--accent); transform: scale(1.25); }
  @media (max-width: 640px) {
    .lab-count { display: none; }
    .type-form input { width: 96px; }
  }
</style>
</head>
<body class="lab" style="--accent:#e5482d">
<main class="lab-stage"><canvas id="c" aria-label="한글 파티클 실험"></canvas></main>
<div class="lab-ui">
  <header class="lab-top">
    <a class="lab-back" href="../"><span class="lab-arrow">←</span><span class="lab-roll"><span>인터랙션 랩</span><span>인터랙션 랩</span></span></a>
    <div class="lab-right">
      <form class="type-form" autocomplete="off">
        <input type="text" maxlength="10" placeholder="내 글자 넣기" aria-label="파티클로 만들 글자" enterkeyhint="done">
        <button type="submit" aria-label="이 글자로 바꾸기">↵</button>
      </form>
      <span class="lab-count">01 / 06</span>
    </div>
  </header>
  <footer class="lab-bottom">
    <div class="lab-meta"><strong>한글 파티클</strong><span>글자 하나가 점 수천 개 — 밀면 흩어지고, 길게 누르면 소용돌이, 탭하면 다음 글자</span></div>
    <a class="lab-next" href="../ink/"><span class="lab-label-long">다음 실험</span><span class="lab-arrow">→</span></a>
  </footer>
</div>
<div class="type-word" aria-hidden="true"></div>
<div class="lab-hint">문질러 보고, 길게 눌러 보세요</div>
<script src="../assets/lab.js"></script>
<script src="particles.js"></script>
<script src="main.js"></script>
</body>
</html>
